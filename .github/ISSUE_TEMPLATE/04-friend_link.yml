name: 友链申请
description: 申请与 MinCiallo 互加友链
title: "[友链申请]: "
labels: ["friend-link"]
assignees:
  - MinCiallo
body:
  - type: markdown
    attributes:
      value: |
        感谢申请友链！请填写以下信息。
  - type: input
    id: site-name
    attributes:
      label: 站点名称
      placeholder: "ex: MinCiallo"
    validations:
      required: true
  - type: input
    id: site-url
    attributes:
      label: 站点链接
      placeholder: "https://"
    validations:
      required: true
  - type: input
    id: site-avatar
    attributes:
      label: 头像链接
      placeholder: "https://"
    validations:
      required: true
  - type: textarea
    id: site-desc
    attributes:
      label: 站点描述
      placeholder: "简短描述您的站点"
    validations:
      required: true
  - type: textarea
    id: friend-link-proof
    attributes:
      label: 友链证据
      description: 请提供已添加本站友链的截图或链接
      placeholder: "您的友链页面链接或截图"
    validations:
      required: true